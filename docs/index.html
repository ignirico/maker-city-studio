<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="description" content="muShenzhen 2026 纪录片脚本及参考影片">
<title>muShenzhen 2026 — 脚本与参考</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
<button id="share">复制链接</button>
<button id="edit">编辑参考</button>
<button id="save" hidden>发布更新</button>
<button id="finish" hidden>结束编辑</button>
<span id="status" role="status">正在加载…</span>
</header>
<main id="document"></main>
<dialog id="login"><form id="login-form">
<h2>编辑参考</h2>
<label>编辑口令 <input id="key" type="password" required autocomplete="current-password"></label>
<p id="login-error" role="alert"></p>
<button type="submit">进入编辑</button> <button type="button" data-close>取消</button>
</form></dialog>
<dialog id="reference-dialog"><form id="reference-form">
<h2 id="form-title">添加参考</h2>
<label>类型 <select id="type"><option value="file">上传影片 / 图片 / 音频</option><option value="link">粘贴影片 / 图片链接</option><option value="note">文字备注</option></select></label>
<label id="file-label">文件 <input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/mp4,video/webm,video/quicktime,audio/mpeg,audio/mp4,audio/wav" multiple></label>
<label id="url-label" hidden>链接 <input id="url" type="url" placeholder="https://…"></label>
<label>标题（可不填）<input id="title" maxlength="120"></label>
<label id="text-label" hidden>文字 <textarea id="text" rows="4" maxlength="4000"></textarea></label>
<label>备注 / 参考时间码 <textarea id="note" rows="2" maxlength="2000" placeholder="例如：00:18–00:32 的切镜节奏"></textarea></label>
<label>章节 <select id="chapter"></select></label>
<label>放置位置 <select id="anchor"></select></label>
<p id="upload-help">单个文件最多 90 MB；更大的影片可以粘贴链接。推荐 MP4（H.264）、JPG、PNG。</p>
<p id="form-error" role="alert"></p>
<button type="submit" id="submit-reference">添加</button> <button type="button" data-close>取消</button>
</form></dialog>
<dialog id="preview"><button type="button" data-close>关闭</button><div id="preview-content"></div></dialog>
<p id="message" role="status" hidden></p>
<script type="module" src="./app.js"></script>
</body>
</html>
